    body {
      margin: 0;

      color: #e0e0e0;
    }

    /* Top bar */
    .topbar {
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 10px 15px;
      position: sticky;
      top: 0;

      margin-right: 15px;
    }

    .sitename {

    }

    .menu {
      display: none;
      position: absolute;
      top: 50px;
      left: 10px;
      background: #1e1e1e;
      border-radius: 6px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      min-width: 200px;
      overflow: hidden;
      z-index: 999;

    .menu a {

    }

 .btn {

	 <script>

<style>
body{
font-family: Arial;
background:#121212;
color:white;
text-align:center;
}

.box{
background:#1e1e1e;
padding:20px;
border-radius:10px;
width:320px;
margin:auto;
margin-top:40px;
}

input,select{
width:100%;
padding:10px;
margin:8px 0;
border-radius:6px;
border:none;
}

button{
background:#00c6ff;
border:none;
padding:12px;
border-radius:20px;
color:white;
font-weight:bold;
cursor:pointer;
width:100%;
}
</style>

</head>

<body>

<h1>Purchase Item</h1>

<div class="box">

<input type="text" id="mcuser" placeholder="Minecraft Username">

<input type="tel" id="phone" placeholder="Phone Number">

<input type="text" id="discord" placeholder="Discord Username">

<select id="item">
<option>Starter Kit</option>
<option>VIP Rank</option>
<option>Diamond Kit</option>
</select>

<button onclick="sendOrder()">Submit Order</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "YOURKEY",
authDomain: "YOURPROJECT.firebaseapp.com",
databaseURL: "https://YOURPROJECT-default-rtdb.firebaseio.com",
projectId: "YOURPROJECT",
storageBucket: "YOURPROJECT.appspot.com",
messagingSenderId: "XXXX",
appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.sendOrder = function(){

let user = document.getElementById("mcuser").value;
let phone = document.getElementById("phone").value;
let discord = document.getElementById("discord").value;
let item = document.getElementById("item").value;

push(ref(db,"orders"),{
minecraft:user,
phone:phone,
discord:discord,
item:item,
time:new Date().toLocaleString()
});

window.location.href="payment.html";

}

</script>

</body>
